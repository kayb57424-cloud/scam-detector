<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

<div class="bg-gray-800 p-6 rounded w-80 shadow-lg">

  <h2 class="text-xl mb-4 text-center text-red-400">
    Admin Login
  </h2>

  <input id="username" placeholder="Username"
    class="w-full p-2 mb-3 bg-gray-700 rounded text-white">

  <input id="password" type="password" placeholder="Password"
    class="w-full p-2 mb-3 bg-gray-700 rounded text-white">

  <button onclick="loginAdmin()"
    class="w-full bg-red-500 p-2 rounded hover:bg-red-600">
    Login
  </button>

  <p id="msg" class="mt-3 text-center text-red-300"></p>

</div>

<script>
async function loginAdmin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!username || !password) {
    document.getElementById("msg").innerText = "Enter username and password";
    return;
  }

  try {
    const res = await fetch("https://scam-detector-1-m22a.onrender.com/api/login/", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: username,
        password: password
      })
    });

    const data = await res.json();

    if (data.message && data.is_admin) {
      window.location.href = "dashboard.html";
    } else {
      document.getElementById("msg").innerText =
        data.error || "Admin access required";
    }

  } catch (error) {
    document.getElementById("msg").innerText = "Server connection error";
    console.error(error);
  }
}
</script>

</body>
</html>
