<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ScamDetector Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex items-center justify-center h-screen">

  <div class="bg-gray-800 p-8 rounded-2xl shadow-lg w-96">

    <h1 class="text-3xl font-bold text-green-400 text-center mb-6">
      ScamDetector
    </h1>

    <!-- USERNAME -->
    <input
      type="text"
      id="username"
      placeholder="Username"
      class="w-full p-3 rounded bg-gray-700 text-white mb-4 outline-none"
    >

    <!-- PASSWORD -->
    <input
      type="password"
      id="password"
      placeholder="Password"
      class="w-full p-3 rounded bg-gray-700 text-white mb-4 outline-none"
    >

    <!-- LOGIN BUTTON -->
    <button
      onclick="loginUser()"
      class="w-full bg-green-500 hover:bg-green-600 p-3 rounded font-bold"
    >
      Login
    </button>

    <!-- REGISTER LINK -->
    <p class="text-center text-gray-400 mt-4">

      No account?

      <a
        href="/register"
        class="text-green-400"
      >
        Register
      </a>

    </p>

  </div>

  <script>

    async function loginUser() {

      // GET VALUES
      const username = document.getElementById("username").value;

      const password = document.getElementById("password").value;

      // VALIDATION
      if (!username || !password) {

        alert("Please fill all fields");

        return;
      }

      try {

        // LOGIN REQUEST
       const res = await fetch(
        "/api/login",
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              username,
              password

            })
          }
        );

        const data = await res.json();

        // ERROR
        if (data.error) {

          alert(data.error);

          return;
        }

        // SUCCESS
        alert("Login successful");

        // ADMIN USER
        if (data.is_admin) {

          window.location.href = "/dashboard";

        }

        // NORMAL USER
        else {

          window.location.href = "/index";

        }

      } catch (error) {

        console.error(error);

        alert("Server error");
      }
    }

  </script>

</body>
</html>
